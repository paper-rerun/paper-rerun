name: Drift watch

# Re-checks, every Monday, whether the problems our reports found are still live:
# dependency releases that break the authors' code, and data files that moved or went offline.
on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check
        run: python -I tools/drift_watch.py --out drift.md
      - name: Summary
        run: cat drift.md >> "$GITHUB_STEP_SUMMARY"
